name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numpy
        run: pip install numpy
      - name: Mind tests
        run: python -m unittest discover -s mind/tests -t .
      - name: Body tests
        run: python -m unittest discover -s body/tests -t .
